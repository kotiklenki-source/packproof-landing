<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

    :root {
      --bg-start: #0b132b;
      --bg-end: #064e3b;
      --card-bg: rgba(28, 37, 65, 0.85);
      --text: #ffffff;
      --muted: #94a3b8;
      --accent-green: #10b981;
      --accent-blue: #3a86ff;
      --accent-blue-hover: #2563eb;
      --border: rgba(58, 134, 255, 0.25);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Навигация */
    nav {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.4);
      -webkit-text-fill-color: initial;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link:hover { color: #fff; }

    .btn-nav {
      background: var(--accent-blue);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(58, 134, 255, 0.3);
    }
    .btn-nav:hover {
      background: var(--accent-blue-hover);
      box-shadow: 0 6px 20px rgba(58, 134, 255, 0.5);
    }

    /* Главный баннер (Hero Section) */
    .hero {
      max-width: 1100px;
      margin: 40px auto 60px auto;
      padding: 0 20px;
      text-align: center;
      box-sizing: border-box;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(58, 134, 255, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(58, 134, 255, 0.3);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin: 0 0 20px 0;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.hero-sub {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 700px;
      margin: 0 auto 35px auto;
      line-height: 1.6;
    }

    .cta-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }
