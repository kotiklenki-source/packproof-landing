<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackProof — Nachweis & Verifikation</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --ppi-green: #22c55e;
            --text-color: #f8fafc;
            --danger: #ef4444;
            --subtext: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ppi-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--ppi-green);
            color: var(--ppi-green);
            font-weight: 900;
            font-size: 0.75rem;
            padding: 3px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .header h1 { margin: 0; font-size: 1.5rem; }
        .header h1 a { color: var(--accent); text-decoration: none; }

        .lang-select {
            background: #334155;
            border: 1px solid #475569;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--ppi-green);
            color: #4ade80;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .video-box { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .info-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem;
        }

        .info-row { display: flex; justify-content: space-between; color: var(--subtext); }
        .info-row span.val { color: #fff; font-weight: 600; }

        .unboxing-section {
            background: #0f172a; border: 1px dashed var(--accent); border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 10px; text-align: center;
        }

        input { background: #334155; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; outline: none; }

        button { padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-success { background: var(--ppi-green); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #475569; color: #fff; }

        @media print {
            body { background: #fff; color: #000; }
            .container { box-shadow: none; border: 1px solid #ccc; max-width: 100%; }
            button, .unboxing-section, .lang-select { display: none !important; }
            .status-badge { border-color: #000; color: #000; }
            .info-card { background: #f9f9f9; border-color: #ccc; }
            .info-row span.val { color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div class="header-logo-group">
            <span class="ppi-badge">PPI</span>
            <div class="header">
                <h1><a href="/" title="PackProof Inspection">PackProof Inspection</a></h1>
            </div>
        </div>
        <select id="langSelect" class="lang-select">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="ru">RU</option>
        </select>
    </div>

    <div id="loading" style="text-align:center;">Verifizierung läuft...</div>

    <div id="content" style="display:none; flex-direction:column; gap:16px;">
        <div class="status-badge" id="t-status">✅ Verifiziert & Gesichert</div>

        <h3 id="t-seller-title">📦 Verpackung durch Verkäufer:</h3>
        <div class="video-box">
            <video id="videoPlayer" controls playsinline></video>
        </div>

        <div class="info-card">
            <div class="info-row"><span id="t-label-id">Sendungs-ID:</span><span class="val" id="dispTrackingId">-</span></div>
            <div class="info-row"><span>SHA-256 Hash:</span><span class="val" id="dispHash" style="font-size:0.75rem;">-</span></div>
        </div>

        <div id="unboxingDisplay" style="display:none;" class="video-box">
            <h3 id="t-buyer-title">🎁 Auspacken durch Käufer:</h3>
            <video id="unboxingPlayer" controls playsinline></video>
        </div>

        <div class="unboxing-section" id="buyerAuthBox">
            <h4 style="margin:0;" id="t-auth-title">🔒 Käufer-Authentifizierung</h4>
            <p style="margin:0; font-size:0.8rem; color:var(--subtext);" id="t-auth-desc">Geben Sie den PIN-Code aus Ihrer Sendung ein, um das Auspack-Video aufzunehmen:</p>
            <input type="password" id="pinInput" placeholder="PIN-Code (z. B. 12345678)">
            <button onclick="unlockUnboxing()" class="btn-primary" id="t-btn-auth">🔐 Kamera öffnen</button>
        </div>

        <div class="unboxing-section" id="camRecorderBox" style="display:none;">
            <video id="camPreview" autoplay muted playsinline style="width:100%; border-radius:8px;"></video>
            <button id="recBtn" onclick="toggleUnboxingRec()" class="btn-primary">🔴 Aufnahme starten</button>
        </div>

        <button onclick="window.print()" class="btn-outline" id="t-btn-pdf">📄 Prüfbericht als PDF drucken</button>
    </div>
</div>

<script>
    const i18n = {
        de: {
            status: "✅ Verifiziert & Gesichert",
            sellerTitle: "📦 Verpackung durch Verkäufer:",
            buyerTitle: "🎁 Auspacken durch Käufer:",
            labelId: "Sendungs-ID:",
            authTitle: "🔒 Käufer-Authentifizierung",
            authDesc: "Geben Sie den PIN-Code aus Ihrer Sendung ein, um das Auspack-Video aufzunehmen:",
            btnAuth: "🔐 Kamera öffnen",
            btnPdf: "📄 Prüfbericht als PDF drucken",
            btnStartRec: "🔴 Auspacken aufnehmen",
            btnStopRec: "⏹️ Stoppen & Hochladen",
            errPin: "Falscher PIN-Code!"
        },
        en: {
            status: "✅ Verified & Secured",
            sellerTitle: "📦 Seller Packing Proof:",
            buyerTitle: "🎁 Buyer Unboxing Proof:",
            labelId: "Tracking ID:",
            authTitle: "🔒 Buyer Authentication",
            authDesc: "Enter the PIN code from your package to record unboxing video:",
            btnAuth: "🔐 Open Camera",
            btnPdf: "📄 Download PDF Report",
            btnStartRec: "🔴 Start Unboxing Record",
            btnStopRec: "⏹️ Stop & Upload",
            errPin: "Incorrect PIN Code!"
        },
        ru: {
            status: "✅ Подлинность подтверждена",
            sellerTitle: "📦 Видео упаковки:",
            buyerTitle: "🎁 Видео распаковки:",
            labelId: "Трек-номер:",
            authTitle: "🔒 Авторизация покупателя",
            authDesc: "Введите ПИН-код из сообщения, чтобы записать видео распаковки:",
            btnAuth: "🔐 Открыть камеру",
            btnPdf: "📄 Сформировать отчёт PDF",
            btnStartRec: "🔴 Начать запись распаковки",
            btnStopRec: "⏹️ Остановить и выгрузить",
            errPin: "Неверный ПИН-код!"
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const trackingId = urlParams.get('id');
    const langSelect = document.getElementById('langSelect');

    let stream = null;
    let mediaRecorder = null;
    let chunks = [];
    let isRecording = false;
    let currentLang = 'de';
    let savedEnteredPin = ""; // Фиксируем ПИН при вводе

    function setLanguage(lang) {
        currentLang = lang;
        const t = i18n[lang];
        document.getElementById('t-status').textContent = t.status;
        document.getElementById('t-seller-title').textContent = t.sellerTitle;
        document.getElementById('t-buyer-title').textContent = t.buyerTitle;
        document.getElementById('t-label-id').textContent = t.labelId;
        document.getElementById('t-auth-title').textContent = t.authTitle;
        document.getElementById('t-auth-desc').textContent = t.authDesc;
        document.getElementById('t-btn-auth').textContent = t.btnAuth;
        document.getElementById('t-btn-pdf').textContent = t.btnPdf;
    }

    function detectLanguage() {
        const userLang = navigator.language || navigator.userLanguage;
        if (userLang.startsWith('ru') || userLang.startsWith('uk')) return 'ru';
        if (userLang.startsWith('en')) return 'en';
        return 'de';
    }

    langSelect.addEventListener('change', (e) => setLanguage(e.target.value));

    async function loadVerification() {
        currentLang = detectLanguage();
        langSelect.value = currentLang;
        setLanguage(currentLang);

        try {
            const res = await fetch(`/api/verify/${encodeURIComponent(trackingId)}`);
            if (!res.ok) throw new Error();
            const data = await res.json();

            document.getElementById('dispTrackingId').textContent = data.tracking_id;
            document.getElementById('dispHash').textContent = data.sha256;
            document.getElementById('videoPlayer').src = data.video_url;

            if (data.unboxing_video_url) {
                document.getElementById('unboxingPlayer').src = data.unboxing_video_url;
                document.getElementById('unboxingDisplay').style.display = 'block';
                document.getElementById('buyerAuthBox').style.display = 'none';
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'flex';
        } catch (e) {
            document.getElementById('loading').textContent = "⚠️ Nachweis nicht gefunden.";
        }
    }

    async function unlockUnboxing() {
        const pin = document.getElementById('pinInput').value.trim();
        if (!pin) return alert(i18n[currentLang].errPin);

        savedEnteredPin = pin; // Запоминаем введенный ПИН-код

        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('camPreview').srcObject = stream;
            document.getElementById('buyerAuthBox').style.display = 'none';
            document.getElementById('camRecorderBox').style.display = 'flex';
        } catch (e) {
            alert("Kamera-Zugriff fehlgeschlagen: " + e.message);
        }
    }

    function toggleUnboxingRec() {
        const btn = document.getElementById('recBtn');
        const t = i18n[currentLang];

        if (!isRecording) {
            chunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.start();
            isRecording = true;
            btn.textContent = t.btnStopRec;
            btn.className = "btn-success";
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.textContent = "...";
            btn.disabled = true;

            setTimeout(async () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const formData = new FormData();
                formData.append("file", blob, `unboxing_${trackingId}.webm`);
                formData.append("tracking_id", trackingId);
                formData.append("pin", savedEnteredPin); // Отправляем зафиксированный ПИН

                const res = await fetch("/api/upload-unboxing", { method: "POST", body: formData });
                if (res.ok) {
                    location.reload();
                } else {
                    const err = await res.json();
                    alert(err.detail || t.errPin);
                    btn.disabled = false;
                    btn.textContent = t.btnStartRec;
                }
            }, 1000);
        }
    }

    loadVerification();
</script>

</body>
</html>
