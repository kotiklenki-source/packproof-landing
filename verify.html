<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackProof — Verpackungsnachweis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden p-6 text-center">
        <!-- Logo Header -->
        <div class="mb-6 flex items-center justify-center gap-2">
            <i class="fa-solid fa-shield-halved text-emerald-400 text-3xl"></i>
            <span class="text-2xl font-bold tracking-wide">PackProof</span>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-400 border-t-transparent"></div>
            <p class="mt-4 text-slate-400">Verpackungsnachweis wird geladen...</p>
        </div>

        <!-- Error Card -->
        <div id="errorCard" class="hidden bg-rose-500/10 border border-rose-500/30 rounded-xl p-6 my-4">
            <i class="fa-solid fa-circle-xmark text-rose-500 text-4xl mb-3"></i>
            <h2 class="text-xl font-bold text-rose-400 mb-2">Verpackungsnachweis nicht gefunden</h2>
            <p class="text-slate-300 text-sm">Für diese Bestellnummer wurde noch keine Dokumentation im System hinterlegt oder der Link ist ungültig.</p>
        </div>

        <!-- Success Content / Video Player -->
        <div id="successContent" class="hidden">
            <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4 mb-6 flex items-center gap-3 text-left">
                <i class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>
                <div>
                    <h3 class="font-semibold text-emerald-400">Verifiziert & Gesichert</h3>
                    <p class="text-xs text-slate-300">Sendungs-ID: <span id="displayTrackingId" class="font-mono text-white font-bold"></span></p>
                </div>
            </div>

            <!-- Video Player -->
            <div class="relative rounded-xl overflow-hidden bg-black border border-slate-700 shadow-inner mb-4">
                <video id="videoPlayer" class="w-full h-auto max-h-[450px]" controls autoplay muted playsinline>
                    Ihr Browser unterstützt dieses Videoformat nicht.
                </video>
            </div>

            <div class="text-left bg-slate-900/60 rounded-lg p-3 border border-slate-700/50 text-xs text-slate-400 space-y-1">
                <p><span class="font-semibold text-slate-300">SHA-256 Hash:</span></p>
                <p id="displayHash" class="font-mono break-all text-[10px] text-emerald-400/80"></p>
            </div>
        </div>
        
        <div class="mt-6 pt-4 border-t border-slate-700/60 text-xs text-slate-500">
            &copy; PackProof Inspection System
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            const errorCard = document.getElementById('errorCard');
            const successContent = document.getElementById('successContent');
            const videoPlayer = document.getElementById('videoPlayer');
            const displayTrackingId = document.getElementById('displayTrackingId');
            const displayHash = document.getElementById('displayHash');

            // Парсим параметры из URL: поддерживаем ?id=..., ?tracking_id=... и путь /verify/ID
            const urlParams = new URLSearchParams(window.location.search);
            let identifier = urlParams.get('id') || urlParams.get('tracking_id') || urlParams.get('identifier');

            // Если параметров нет в query string, пробуем взять из пути URL
            if (!identifier) {
                const pathParts = window.location.pathname.split('/').filter(p => p);
                if (pathParts.length > 1 && pathParts[0] === 'verify') {
                    identifier = pathParts[1];
                }
            }

            if (!identifier) {
                loading.classList.add('hidden');
                errorCard.classList.remove('hidden');
                return;
            }

            // Запрос верификации к бэкенду
            fetch(`/api/verify/${encodeURIComponent(identifier)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Verification failed');
                    }
                    return response.json();
                })
                .then(data => {
                    loading.classList.add('hidden');
                    if (data.status === 'verified' && data.video_url) {
                        displayTrackingId.textContent = data.tracking_id || identifier;
                        displayHash.textContent = data.sha256 || 'N/A';
                        videoPlayer.src = data.video_url;
                        successContent.classList.remove('hidden');
                    } else {
                        errorCard.classList.remove('hidden');
                    }
                })
                .catch(err => {
                    console.error('Error fetching verification:', err);
                    loading.classList.add('hidden');
                    errorCard.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
