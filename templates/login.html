<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackProof - Anmelden & Registrieren</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <!-- Логотип и заголовок по центру -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider text-indigo-400">PackProof</h1>
            <p class="text-sm text-slate-400 mt-1">Sichere Beweise für jeden Versand</p>
        </div>

        <!-- Четкий переключатель вкладок (Вход / Регистрация) -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tab-login" type="button" onclick="switchTab('login')" class="flex-1 pb-2 text-center font-semibold border-b-2 border-indigo-500 text-indigo-400 transition">Anmelden</button>
            <button id="tab-register" type="button" onclick="switchTab('register')" class="flex-1 pb-2 text-center font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Registrieren</button>
        </div>

        <!-- Форма Входа (Login) -->
        <form id="form-login" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">E-Mail-Adresse</label>
                <input type="email" name="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="name@beispiel.de">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Passwort</label>
                <input type="password" name="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition duration-200 shadow-md">
                Anmelden
            </button>
        </form>

        <!-- Форма Регистрации (Register) - изначально скрыта -->
        <form id="form-register" action="/register" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">E-Mail-Adresse</label>
                <input type="email" name="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="name@beispiel.de">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Passwort erstellen</label>
                <input type="password" name="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition duration-200 shadow-md">
                Kostenlos registrieren
            </button>
        </form>

        <!-- Ссылка на возврат на главную -->
        <div class="text-center mt-6">
            <a href="/" class="text-xs text-slate-400 hover:text-indigo-400 transition">← Zurück zur Startseite</a>
        </div>
    </div>

    <!-- Скрипт переключения вкладок -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('border-indigo-500', 'text-indigo-400');
                tabLogin.classList.remove('border-transparent', 'text-slate-400');
                tabRegister.classList.add('border-transparent', 'text-slate-400');
                tabRegister.classList.remove('border-indigo-500', 'text-indigo-400');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('border-indigo-500', 'text-indigo-400');
                tabRegister.classList.remove('border-transparent', 'text-slate-400');
                tabLogin.classList.add('border-transparent', 'text-slate-400');
                tabLogin.classList.remove('border-indigo-500', 'text-indigo-400');
            }
        }
    </script>
</body>
</html>
