<!DOCTYPE html>
<html lang="de" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackProof - Anmelden & Registrieren</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center px-4">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <!-- Логотип и заголовок по центру -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider text-indigo-400">PackProof</h1>
            <p class="text-sm text-slate-400 mt-1">Sichere Beweise für jeden Versand</p>
        </div>

        <!-- Переключатель вкладок (Вход / Регистрация) -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tab-login" type="button" onclick="switchTab('login')" class="flex-1 pb-2 text-center font-semibold border-b-2 border-indigo-500 text-indigo-400 transition">Anmelden</button>
            <button id="tab-register" type="button" onclick="switchTab('register')" class="flex-1 pb-2 text-center font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Registrieren</button>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-rose-500/20 border border-rose-500 text-rose-300 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="mb-4 p-3 rounded-lg bg-emerald-500/20 border border-emerald-500 text-emerald-300 text-sm text-center">
            {{ success }}
        </div>
        {% endif %}

        <!-- Форма Входа (Login) -->
        <form id="form-login" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">E-Mail-Adresse</label>
                <input type="email" name="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="name@beispiel.de">
            </div>
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-sm font-medium text-slate-300">Passwort</label>
                    <a href="/forgot-password" class="text-xs text-indigo-400 hover:text-indigo-300 transition">Passwort vergessen?</a>
                </div>
                <div class="relative">
                    <input id="login-password" type="password" name="password" required class="w-full px-4 py-2 pr-11 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('login-password', this)" aria-label="Passwort anzeigen" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-200 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5S21.75 12 21.75 12s-3.75 7.5-9.75 7.5S2.25 12 2.25 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition duration-200 shadow-md">
                Anmelden
            </button>
        </form>

        <!-- Форма Регистрации (Register) - изначально скрыта -->
        <form id="form-register" action="/register" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">E-Mail-Adresse</label>
                <input type="email" name="email" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="name@beispiel.de">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Passwort erstellen (min. 6 Zeichen)</label>
                <div class="relative">
                    <input id="register-password" type="password" name="password" minlength="6" required class="w-full px-4 py-2 pr-11 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('register-password', this)" aria-label="Passwort anzeigen" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-200 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5S21.75 12 21.75 12s-3.75 7.5-9.75 7.5S2.25 12 2.25 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition duration-200 shadow-md">
                Kostenlos registrieren
            </button>
        </form>

        <!-- Ссылка на возврат на главную -->
        <div class="text-center mt-6">
            <a href="/" class="text-xs text-slate-400 hover:text-indigo-400 transition">← Zurück zur Startseite</a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('border-indigo-500', 'text-indigo-400');
                tabLogin.classList.remove('border-transparent', 'text-slate-400');
                tabRegister.classList.add('border-transparent', 'text-slate-400');
                tabRegister.classList.remove('border-indigo-500', 'text-indigo-400');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('border-indigo-500', 'text-indigo-400');
                tabRegister.classList.remove('border-transparent', 'text-slate-400');
                tabLogin.classList.add('border-transparent', 'text-slate-400');
                tabLogin.classList.remove('border-indigo-500', 'text-indigo-400');
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            btn.classList.toggle('text-indigo-400', isHidden);
            btn.classList.toggle('text-slate-400', !isHidden);
        }
    </script>
</body>
</html>
